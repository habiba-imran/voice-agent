[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "voiceagent-core"
version = "0.1.0"
description = "Copyable direct-provider LiveKit voice worker"
requires-python = ">=3.12,<3.14"
dependencies = [
  "livekit-agents[deepgram,groq,cartesia,silero,turn-detector]==1.8.10",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0.2,<7",
  "python-dotenv>=1.1,<2",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1", "pathspec>=0.12,<1"]

[project.scripts]
voiceagent = "voiceagent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voiceagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"
markers = ["integration: offline SDK and copy-in checks", "live: requires explicit credit approval and credentials"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
